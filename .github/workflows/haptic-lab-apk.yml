name: Haptic Lab APK

concurrency:
  group: haptic-lab-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "HapticLab/**"
      - ".github/workflows/haptic-lab-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HapticLab
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK; AGP downloads the compileSdk platform itself.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E "^\s*platforms;android-3[6-9]" | sort -u || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HapticLab-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HapticLab-debug-apk
          path: HapticLab/HapticLab-debug.apk

      - name: Publish APK to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: haptic-lab-build-${{ github.run_number }}
          name: Haptic Lab debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Haptic Lab debug APK built from ${{ github.sha }}.

            Always-latest download: https://github.com/${{ github.repository }}/releases/latest/download/HapticLab-debug.apk
          files: HapticLab/HapticLab-debug.apk
