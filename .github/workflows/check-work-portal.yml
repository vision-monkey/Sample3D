name: Check work-portal (read-only)
on:
  push:
    branches: [ccr-dfd948e5-vy9aup]
    paths: [.github/workflows/check-work-portal.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secure SQL checks (no valid record is written)
        run: |
          B=https://jdsijuzddnbpambncaaz.supabase.co/rest/v1
          K=sb_publishable_aetzy_5TBbXIcFNXojAaOw_0JDWiNzl
          H=(-H "apikey: $K" -H "Content-Type: application/json")
          call() { echo "--- $1"; curl -sS -m 20 -w "  [HTTP %{http_code}]\n" -X POST "$B/$2" "${H[@]}" -d "$3"; echo; }
          echo "records before: $(curl -sS -m 20 -I "$B/records?select=id" -H "apikey: $K" -H 'Prefer: count=exact' | tr -d '\r' | grep -i content-range)"
          call "direct insert (expect 401/403)" records '{"game_id":"risk","name":"probe","score":50}'
          call "start_session bad game (expect invalid_game)" rpc/start_session '{"p_game":"hack"}'
          S=$(curl -sS -m 20 -X POST "$B/rpc/start_session" "${H[@]}" -d '{"p_game":"risk"}' | tr -d '"')
          echo "--- start_session risk -> $S"
          call "impossible score (expect invalid_score)" rpc/submit_record "{\"p_session\":\"$S\",\"p_name\":\"검증\",\"p_group\":\"\",\"p_score\":0.5}"
          call "bad name (expect bad_name)" rpc/submit_record "{\"p_session\":\"$S\",\"p_name\":\"시1발\",\"p_group\":\"\",\"p_score\":30}"
          call "unknown session (expect invalid_session)" rpc/submit_record '{"p_session":"00000000-0000-0000-0000-000000000000","p_name":"x","p_group":"","p_score":30}'
          echo "--- sessions table hidden (expect 401/403/404)"; curl -sS -m 20 -w "  [HTTP %{http_code}]\n" "$B/game_sessions?select=id&limit=1" -H "apikey: $K"; echo
          echo "records after: $(curl -sS -m 20 -I "$B/records?select=id" -H "apikey: $K" -H 'Prefer: count=exact' | tr -d '\r' | grep -i content-range)"
          echo "--- CORS preflight for rpc"
          curl -sS -m 20 -o /dev/null -D - -X OPTIONS "$B/rpc/submit_record" -H "Origin: https://vision-monkey.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,content-type" | tr -d '\r' | grep -i "^access-control\|^HTTP"
