name: Check work-portal (read-only)
on:
  push:
    branches: [ccr-dfd948e5-vy9aup]
    paths: [.github/workflows/check-work-portal.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: New games accepted by server (no valid record is written)
        run: |
          B=https://jdsijuzddnbpambncaaz.supabase.co/rest/v1
          K=sb_publishable_aetzy_5TBbXIcFNXojAaOw_0JDWiNzl
          H=(-H "apikey: $K" -H "Content-Type: application/json")
          for g in dodge risk_hard risk; do
            S=$(curl -sS -m 20 -X POST "$B/rpc/start_session" "${H[@]}" -d "{\"p_game\":\"$g\"}")
            echo "start_session $g -> $S"
          done
          S=$(curl -sS -m 20 -X POST "$B/rpc/start_session" "${H[@]}" -d '{"p_game":"dodge"}' | tr -d '"')
          echo "--- dodge: claim 300s right after start (expect invalid_score)"
          curl -sS -m 20 -w "  [HTTP %{http_code}]\n" -X POST "$B/rpc/submit_record" "${H[@]}" -d "{\"p_session\":\"$S\",\"p_name\":\"검증\",\"p_group\":\"\",\"p_score\":300}"
          echo "--- dodge: 0.5s (expect invalid_score)"
          curl -sS -m 20 -w "  [HTTP %{http_code}]\n" -X POST "$B/rpc/submit_record" "${H[@]}" -d "{\"p_session\":\"$S\",\"p_name\":\"검증\",\"p_group\":\"\",\"p_score\":0.5}"
          echo "--- unknown game still rejected (expect invalid_game)"
          curl -sS -m 20 -w "  [HTTP %{http_code}]\n" -X POST "$B/rpc/start_session" "${H[@]}" -d '{"p_game":"hack"}'
          echo "--- record count by game"
          for g in dodge risk_hard; do echo "$g: $(curl -sS -m 20 -I "$B/records?select=id&game_id=eq.$g" -H "apikey: $K" -H 'Prefer: count=exact' | tr -d '\r' | grep -i content-range)"; done
          echo "total: $(curl -sS -m 20 -I "$B/records?select=id" -H "apikey: $K" -H 'Prefer: count=exact' | tr -d '\r' | grep -i content-range)"
          echo "--- deployed site"
          S2=https://vision-monkey.github.io/Sample3D/work-portal
          echo "games.js: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' $S2/games.js), has dodge: $(curl -sS -m 20 $S2/games.js | grep -c "id: 'dodge'"), has risk_hard: $(curl -sS -m 20 $S2/games.js | grep -c "id: 'risk_hard'")"
