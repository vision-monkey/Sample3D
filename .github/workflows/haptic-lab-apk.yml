name: Haptic Lab APK

on:
  push:
    paths:
      - "HapticLab/**"
      - ".github/workflows/haptic-lab-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HapticLab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HapticLab-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HapticLab-debug-apk
          path: HapticLab/HapticLab-debug.apk

      - name: Publish APK to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: haptic-lab-build-${{ github.run_number }}
          name: Haptic Lab debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: HapticLab/HapticLab-debug.apk
