name: Check work-portal (read-only)
on:
  push:
    branches: [ccr-dfd948e5-vy9aup]
    paths: [.github/workflows/check-work-portal.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: diff game accepted by server (no valid record is written)
        run: |
          B=https://jdsijuzddnbpambncaaz.supabase.co/rest/v1
          K=sb_publishable_aetzy_5TBbXIcFNXojAaOw_0JDWiNzl
          H=(-H "apikey: $K" -H "Content-Type: application/json")
          for g in diff dodge risk_hard; do echo "start_session $g -> $(curl -sS -m 20 -X POST "$B/rpc/start_session" "${H[@]}" -d "{\"p_game\":\"$g\"}")"; done
          S=$(curl -sS -m 20 -X POST "$B/rpc/start_session" "${H[@]}" -d '{"p_game":"diff"}' | tr -d '"')
          echo "--- diff: 40s right after start (expect invalid_score, play time < 15s)"
          curl -sS -m 20 -w "  [HTTP %{http_code}]\n" -X POST "$B/rpc/submit_record" "${H[@]}" -d "{\"p_session\":\"$S\",\"p_name\":\"검증\",\"p_group\":\"\",\"p_score\":40}"
          echo "--- unknown game (expect invalid_game)"
          curl -sS -m 20 -w "  [HTTP %{http_code}]\n" -X POST "$B/rpc/start_session" "${H[@]}" -d '{"p_game":"hack"}'
          for g in diff dodge risk_hard; do echo "$g records: $(curl -sS -m 20 -I "$B/records?select=id&game_id=eq.$g" -H "apikey: $K" -H 'Prefer: count=exact' | tr -d '\r' | grep -i content-range)"; done
          echo "total: $(curl -sS -m 20 -I "$B/records?select=id" -H "apikey: $K" -H 'Prefer: count=exact' | tr -d '\r' | grep -i content-range)"
          S2=https://vision-monkey.github.io/Sample3D/work-portal
          echo "deployed games.js has diff: $(curl -sS -m 20 $S2/games.js | grep -c "id: 'diff'"), harder dodge: $(curl -sS -m 20 $S2/games.js | grep -c "const URGENT")"
